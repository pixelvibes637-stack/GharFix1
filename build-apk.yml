name: Build GharFix APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "APK version"
        required: true
        default: "1.0.0"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract GharFix ZIP
        run: |
          unzip -o "GharFix-Android-APK-ready.zip" -d extracted
          cp -a extracted/. .

          echo "Project extracted successfully"
          ls -la

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack prepare pnpm@10.10.0 --activate
          pnpm --version

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GharFix web app
        env:
          PORT: "4173"
          BASE_PATH: "/"
          NODE_ENV: "production"
        run: pnpm --filter @workspace/gharfix build

      - name: Install Capacitor
        working-directory: mobile-wrapper
        run: npm install

      - name: Add Android project
        working-directory: mobile-wrapper
        run: npx cap add android

      - name: Sync GharFix into Android
        working-directory: mobile-wrapper
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile-wrapper/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release

          cp mobile-wrapper/android/app/build/outputs/apk/debug/app-debug.apk \
            "release/GharFix-${{ github.event.inputs.version || '1.0.0' }}.apk"

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GharFix-APK
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"

          gh release create "$TAG" \
            release/GharFix-${VERSION}.apk \
            --title "GharFix ${VERSION}" \
            --notes "GharFix Android APK"
